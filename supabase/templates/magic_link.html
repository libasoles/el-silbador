<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>El Silbador</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f2ee;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f2ee;">
      <tr>
        <td align="center" style="padding: 40px 16px;">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 420px;
              background-color: #ffffff;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <tr>
              <td align="center" style="padding: 40px 32px 8px;">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="56"
                  height="56"
                  viewBox="0 0 64 64"
                  fill="none"
                  stroke="#1a1a1a"
                  stroke-width="2.15"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M13.5 27C12.6 22.2 13.8 17.3 17.1 13.8C20.2 10.5 24.9 8.8 30.1 9.1C35.2 9.4 39.1 12.2 44.4 13.6C47.5 14.4 50.6 14.6 53.3 13.9C52.3 16.2 50.2 18.1 47.4 19.3C42.3 21.5 35.1 20.5 29.1 17.6C27.1 21.9 22.8 25.7 17.5 27.4" />
                  <path d="M16.5 26.7C13.2 25.8 10.7 27.6 10.8 31C10.9 34.5 13.7 36.5 17.2 35.6" />
                  <path d="M17.4 27.2C17.6 33.5 19.8 38.6 23.8 41.6C27.2 44.1 31.7 45.1 35.9 44.1C43.3 42.4 47.8 36.3 48.1 27.8L48.1 20" />
                  <path d="M23.4 30.4C24.3 28.7 26.7 28.7 27.7 30.4" />
                  <path d="M36.5 30.4C37.5 28.7 39.9 28.7 40.8 30.4" />
                  <path d="M29.3 37.1C30.8 39.1 33.6 39.1 35.1 37.1" />
                </svg>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 8px 32px 0;">
                <p
                  style="
                    margin: 0;
                    font-size: 13px;
                    font-weight: 600;
                    letter-spacing: 0.02em;
                    color: #8a8a8a;
                    text-transform: uppercase;
                  "
                >
                  El Silbador
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 12px 32px 0;">
                <h1
                  style="
                    margin: 0;
                    font-size: 22px;
                    font-weight: 600;
                    color: #1a1a1a;
                  "
                >
                  Tu enlace de acceso
                </h1>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 12px 32px 0;">
                <p
                  style="
                    margin: 0;
                    font-size: 15px;
                    line-height: 1.5;
                    color: #4a4a4a;
                  "
                >
                  Tocá el botón para entrar en El Silbador. Si no pediste este enlace, podés ignorar este mensaje.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 28px 32px 8px;">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    background-color: #1a1a1a;
                    color: #ffffff;
                    text-decoration: none;
                    font-size: 15px;
                    font-weight: 600;
                    padding: 14px 28px;
                    border-radius: 8px;
                  "
                >
                  Entrar
                </a>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 20px 32px 40px;">
                <p style="margin: 0; font-size: 12px; line-height: 1.5; color: #a0a0a0;">
                  Este enlace caduca pronto. Si el botón no funciona, copiá y pegá esta dirección en tu navegador:
                  <br />
                  <span style="word-break: break-all;">{{ .ConfirmationURL }}</span>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
