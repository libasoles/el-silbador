<!DOCTYPE html>
<html lang="es">
  <body
    style="
      margin: 0;
      padding: 0;
      color: #2a2622;
      font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    "
  >
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      style="
        max-width: 420px;
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        color: #2a2622;
      "
    >
      <tr>
        <td valign="top" style="width: 56px; padding: 0 12px 0 0">
          <!-- Gmail y la mayoría de los clientes de mail eliminan <svg> inline: se usa PNG alojado -->
          <img src="https://elsilbador.com.ar/email/happy.png" width="80" height="80" alt="" style="display: block; border: 0" />
        </td>
        <td valign="top">
          <h2 style="margin: 0; font-size: 16px; font-weight: 600">Hace click para identificarte.</h2>
          <p style="margin: 0; font-size: 14px; color: #8a8175">No necesitas contraseña.</p>
          <p style="margin: 0; font-size: 14px">
            <a href="{{ .ConfirmationURL }}" style="color: #517891; text-decoration: none;">
              <img src="https://elsilbador.com.ar/email/open-link.png" width="14" height="14" alt="" style="display: inline-block; vertical-align: -2px; border: 0" />
              Confirmar
            </a>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
