<text x="550" y="182" class="verse">¿Sabes tú lo que es amar?</text><text x="1046" y="181" class="count">8</text><circle cx="1098" cy="173" r="13" fill="none" stroke="#111111" stroke-width="1.5"/><text x="1098" y="179" text-anchor="middle" font-size="20" style="fill:#111111">a</text>
<text x="550" y="219" class="verse">¿sabes tú lo que es sufrir?</text><text x="1046" y="218" class="count">8</text><circle cx="1098" cy="210" r="13" fill="none" stroke="#111111" stroke-width="1.5"/><text x="1098" y="216" text-anchor="middle" font-size="20" style="fill:#111111">b</text>
<text x="550" y="256" class="verse">fuego en el alma sentir</text><text x="1046" y="255" class="count">8</text><circle cx="1098" cy="247" r="13" fill="none" stroke="#111111" stroke-width="1.5"/><text x="1098" y="253" text-anchor="middle" font-size="20" style="fill:#111111">b</text>
<text x="550" y="293" class="verse">y no poderlo apagar?</text><text x="1046" y="292" class="count">8</text><circle cx="1098" cy="284" r="13" fill="none" stroke="#111111" stroke-width="1.5"/><text x="1098" y="290" text-anchor="middle" font-size="20" style="fill:#111111">a</text>
<text x="550" y="330" class="verse">En constante delirar</text><text x="1046" y="329" class="count">8</text><circle cx="1098" cy="321" r="13" fill="none" stroke="#111111" stroke-width="1.5"/><text x="1098" y="327" text-anchor="middle" font-size="20" style="fill:#111111">a</text>
<text x="550" y="367" class="verse">sucumbir al desconsuelo</text><text x="1046" y="366" class="count">8</text><circle cx="1098" cy="358" r="13" fill="none" stroke="#111111" stroke-width="1.5"/><text x="1098" y="364" text-anchor="middle" font-size="20" style="fill:#111111">c</text>
<text x="550" y="404" class="verse">luchar con ardiente anhelo</text><text x="1046" y="403" class="count">8</text><circle cx="1098" cy="395" r="13" fill="none" stroke="#111111" stroke-width="1.5"/><text x="1098" y="401" text-anchor="middle" font-size="20" style="fill:#111111">c</text>
