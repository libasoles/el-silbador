<text x="550" y="478" class="verse">y a la pena más horrible</text><text x="1046" y="477" class="count">8</text><circle cx="1098" cy="469" r="13" fill="none" stroke="#111111" stroke-width="1.5"/><text x="1098" y="475" text-anchor="middle" font-size="20" style="fill:#111111">d</text>
