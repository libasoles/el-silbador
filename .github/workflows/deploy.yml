name: Deploy

# El build corre acá (Netlify CLI con su adaptador de Next.js) y Netlify solo recibe el resultado:
# no consume minutos de build de Netlify.
# Requiere los secrets NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID, NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_GA_MEASUREMENT_ID y SENTRY_AUTH_TOKEN,
# y los builds automáticos de Netlify desactivados.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El package-lock.json se generó en macOS y solo trae el binding de rolldown (vitest) para darwin;
      # npm tiene un bug con las dependencias opcionales (npm/cli#4828). Regenerar el lockfile
      # actualizaría cientos de paquetes, así que se agrega el binding de Linux sin tocar el lockfile.
      - name: Binding de rolldown para Linux
        run: npm install --no-save --no-package-lock --ignore-scripts "@rolldown/binding-linux-x64-gnu@$(node -p "require('rolldown/package.json').version")"

      - run: npm test

      - name: Build y publicar en Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npx --yes netlify-cli deploy --build --prod --message "${GITHUB_SHA::7} ${{ github.event.head_commit.message }}"
